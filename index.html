<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Tâm Khách Hàng - Hendy Cybertech</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #080511; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Profile Box */
        .profile-box {
            border: 2px solid #ff0033;
            background: linear-gradient(135deg, #120918 0%, #050208 100%);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
            margin-bottom: 25px;
        }
        .profile-left { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 60px; height: 60px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .user-info h3 { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .badge-id { background: #00e5ff22; color: #00e5ff; padding: 3px 10px; border-radius: 20px; font-size: 12px; border: 1px solid #00e5ff55; }
        .badge-vip { background: #ffaa00; color: #000; padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-top: 5px; display: inline-block; }
        
        .profile-right { text-align: right; }
        .wallet-item { font-size: 14px; margin-bottom: 4px; }
        .wallet-item span { font-weight: bold; color: #00e5ff; }
        .wallet-item.voucher span { color: #ff0055; }

        /* Section Title */
        .section-title { font-size: 16px; color: #00e5ff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

        /* Stats Tables */
        .stats-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 25px; }
        .stats-box { background: #110c1d; border: 1px solid #2a1f3d; border-radius: 8px; padding: 15px; }
        .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 0; }
        .stat-card { background: #181026; border: 1px solid #332244; border-radius: 6px; padding: 15px; text-align: center; }
        .stat-card span { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
        .stat-card strong { font-size: 20px; color: #00ff66; }

        /* Bottom Nav Buttons */
        .nav-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; }
        .nav-btn { background: #181026; border: 1px solid #442266; color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .nav-btn:hover, .nav-btn.active { background: #331155; border-color: #00e5ff; color: #00e5ff; }

        /* Data Display Box */
        .data-display-box { background: #110c1d; border: 1px solid #2a1f3d; border-radius: 8px; padding: 20px; min-height: 150px; text-align: center; }
        .data-item { background: #181026; border: 1px solid #332244; padding: 10px 15px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .empty-msg { color: #888; font-size: 13px; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Profile Header -->
        <div class="profile-box">
            <div class="profile-left">
                <div class="avatar">🐼</div>
                <div class="user-info">
                    <h3>@ngogiaidy</h3>
                    <span class="badge-id">🆔 ID: 8639286417</span><br>
                    <span class="badge-vip">VIP 0</span>
                </div>
            </div>
            <div class="profile-right">
                <div class="wallet-item">VÍ CHÍNH (NẠP): <span id="web-balance">5,500đ</span></div>
                <div class="wallet-item voucher">VÍ VOUCHER: <span>0đ</span></div>
            </div>
        </div>

        <!-- Thống kê tổng quan -->
        <div class="stats-grid">
            <div class="stats-box">
                <div class="section-title" style="font-size: 14px;">📊 THỐNG KÊ TÀI KHOẢN & MÃ CODE</div>
                <div class="stats-row">
                    <div class="stat-card">
                        <span>TÀI KHOẢN ĐÃ LIÊN KẾT</span>
                        <strong id="stat-linked">0</strong>
                    </div>
                    <div class="stat-card">
                        <span>TK ĐÃ TRÚNG CODE</span>
                        <strong id="stat-won">0</strong>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="nav-buttons">
            <button class="nav-btn active" onclick="switchTab('linked')" id="btn-linked">🎯 TÀI KHOẢN ĐÃ LIÊN KẾT</button>
            <button class="nav-btn" onclick="switchTab('won')" id="btn-won">📜 LỊCH SỬ TRÚNG CODE</button>
        </div>

        <!-- Khu vực hiển thị danh sách khi bấm nút -->
        <div class="data-display-box" id="content-box">
            <!-- Nội dung sẽ tự động thay đổi bằng JS -->
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name');
        const id = urlParams.get('id');
        const balance = urlParams.get('balance');

        if (name) document.querySelector('.user-info h3').innerText = '@' + decodeURIComponent(name);
        if (id) document.querySelector('.badge-id').innerText = '🆔 ID: ' + id;
        if (balance) document.getElementById('web-balance').innerText = Number(balance).toLocaleString() + 'đ';

        // Dữ liệu mẫu (Sếp có thể thay đổi hoặc nhận dữ liệu truyền qua URL)
        let linkedAccounts = urlParams.get('linked_list') ? JSON.parse(decodeURIComponent(urlParams.get('linked_list'))) : [];
        let wonCodes = urlParams.get('won_list') ? JSON.parse(decodeURIComponent(urlParams.get('won_list'))) : [];

        // Cập nhật số lượng lên thống kê
        document.getElementById('stat-linked').innerText = linkedAccounts.length;
        document.getElementById('stat-won').innerText = wonCodes.length;

        function switchTab(tab) {
            document.getElementById('btn-linked').classList.remove('active');
            document.getElementById('btn-won').classList.remove('active');
            
            const box = document.getElementById('content-box');
            box.innerHTML = '';

            if (tab === 'linked') {
                document.getElementById('btn-linked').classList.add('active');
                if (linkedAccounts.length === 0) {
                    box.innerHTML = '<div class="empty-msg">📦 Bạn chưa liên kết tài khoản nào.</div>';
                } else {
                    linkedAccounts.forEach((acc, index) => {
                        box.innerHTML += `<div class="data-item"><span>${index + 1}. Tài khoản: <strong>${acc}</strong></span><span style="color:#00ff66;">✅ Đã liên kết</span></div>`;
                    });
                }
            } else {
                document.getElementById('btn-won').classList.add('active');
                if (wonCodes.length === 0) {
                    box.innerHTML = '<div class="empty-msg">📦 Chưa có lịch sử trúng code nào.</div>';
                } else {
                    wonCodes.forEach((code, index) => {
                        box.innerHTML += `<div class="data-item"><span>${index + 1}. Mã Code: <strong>${code}</strong></span><span style="color:#ffaa00;">🎉 Đã trúng</span></div>`;
                    });
                }
            }
        }

        // Mặc định hiển thị tab tài khoản liên kết khi load trang
        switchTab('linked');
    </script>
</body>
</html>
